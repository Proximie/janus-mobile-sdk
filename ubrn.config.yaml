# uniffi-bindgen-react-native configuration
# https://jhugman.github.io/uniffi-bindgen-react-native/reference/config-yaml.html

crates:
  - manifestPath: rslib/Cargo.toml
    libraryName: janus_gateway

bindings:
  # Directory where TypeScript bindings are generated
  outDir: ts

web:
  # Directory where wasm-bindgen outputs the WASM binary and JS glue code
  outDir: dist
  # wasm-bindgen target (web = ES module with top-level init)
  target: web
