[package]
name = "rslib"
version = "0.17.3"
edition = "2024"
publish = false
repository = "https://github.com/Proximie/janus-mobile-sdk"

[lib]
name = "janus_gateway"
crate-type = ["cdylib", "staticlib", "lib"]

# Cargo will log a warn on this, its fine to ignore since the suggested solution (moving it to the root Cargo.toml)
# didn't work. https://github.com/rust-lang/cargo/issues/15262
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.1"
log = "0.4.33"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uniffi = { workspace = true, features = ["tokio"] }
# TODO: repoint to the published `1.10.0` crate once jarust is released.
# Temporarily tracks the jarust custom-transport branch (Proximie/jarust#244) so this
# builds before the crate is published. For local testing you can swap this for a
# `path = "../../jarust/jarust"` dep.
jarust = { git = "https://github.com/Proximie/jarust", branch = "feat/custom-transport-interface", features = [
    "echo-test-plugin",
    "audio-bridge-plugin",
    "video-room-plugin",
    "legacy-video-room-plugin",
    "ffi-compatible",
    "__plugin-experimental",
] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
apple-tracing-sub = { version = "*", path = "../apple-tracing-sub" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
# Newer versions of openssl-sys have a bug that causes the build to fail
openssl-sys = { version = "=0.9.87", features = ["vendored"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
